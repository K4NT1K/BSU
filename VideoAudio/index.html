<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Видео</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Новогодний мультфильм</h1>
<img src="img/fon.jpg" alt="Фон сайта">
<video
        id="video"
        src="img/multfilm.mp4"
        poster="img/poster.jpg"
        preload="metadata"
></video>

<div id="buttons">
    <div class="timeline">
        <input type="range" id="range-time" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="controls-row">
        <div class="control-group timer-group">
            <span id="current-time">00:00 / 00:00</span>
        </div>

        <div class="control-group rewind-group">
            <img src="img/rewind-back.svg" class="icon" id="rewind-back" title="Назад 10 сек"/>
            <img src="img/play.svg" class="icon play-btn" id="play" title="Воспроизвести/Пауза"/>
            <img src="img/rewind-forward.svg" class="icon" id="rewind-forward" title="Вперед 10 сек"/>
        </div>

        <div class="control-group speed-group">
            <select name="speed" id="speed" title="Скорость воспроизведения">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>
        </div>

        <div class="control-group volume-group">
            <img src="img/volume-up.svg" class="icon" id="volume_stop" title="Выключить/включить звук"/>
            <input type="range" min="0" max="1" step="0.01" id="volume" title="Громкость" value="0.1">
        </div>
    </div>
</div>

<script src="play.js"></script>
</body>
</html>
